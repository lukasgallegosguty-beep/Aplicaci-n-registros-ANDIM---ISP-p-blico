document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

mat('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2078004e-7780-42be-b480-5c2ece8baffc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"951f3e83-69c6-44dd-9916-59334ad814e9\"><\u002Fscript>\n<script src=\"51117e94-8c9a-426e-b185-dd3dce09846c\"><\u002Fscript>\n<script src=\"fcb09578-7c92-47e8-a232-0e76ecf13392\"><\u002Fscript>\n<script src=\"eea30fe5-b5dc-4ff9-a65e-d10f80559507\"><\u002Fscript>\n<script src=\"ce8d5d9b-c4be-42dd-bf91-91224f8b51ee\"><\u002Fscript>\n<style>\nhtml,body{height:100%;margin:0}\n@keyframes andim-spin{to{transform:rotate(360deg)}}\na{color:var(--color-accent);text-underline-offset:3px}\na:hover{color:var(--color-accent-700)}\ninput[type=\"file\"]{display:none}\n.andim-icon svg{width:100%;height:100%;display:block}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:100%;height:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden;position:relative\">\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;height:100%\">\n  <div style=\"display:flex;align-items:center;gap:10px;padding:max(14px, env(safe-area-inset-top)) 16px 12px;border-bottom:2px solid var(--color-divider);flex-shrink:0\">\n    <img src=\"d44c86bf-46b3-43f6-8501-dfb4038d6ba0\" alt=\"ISP Chile\" style=\"height:26px;width:auto;display:block\">\n    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6\">ANDIM · Fiscalización<\u002Fspan>\n    <button class=\"btn btn-icon btn-ghost\" style=\"width:44px;height:44px;margin-left:auto\" title=\"Actualizar datos\" sc-camel-on-click=\"{{ goImport }}\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8\"><\u002Fpath><path d=\"M21 3v5h-5\"><\u002Fpath><path d=\"M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16\"><\u002Fpath><path d=\"M8 16H3v5\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:18px 16px 32px\">\n    <h1 style=\"margin:6px 0 4px;font-size:28px\">Registros ANDIM<\u002Fh1>\n    <p style=\"margin:0 0 22px;font-size:13px;opacity:.65;max-width:42ch\">Verifica en terreno si un dispositivo médico tiene registro sanitario vigente ante el ISP.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:26px\">\n      <button class=\"btn btn-primary btn-block\" style=\"height:58px;font-size:16px;margin-top:0\" sc-camel-on-click=\"{{ goScan }}\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 5h-5L7.8 7.2A2 2 0 0 1 6.1 8H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-2.1a2 2 0 0 1-1.7-.8Z\"><\u002Fpath><circle cx=\"12\" cy=\"13.5\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n        Escanear producto\n      <\u002Fbutton>\n      <button class=\"btn btn-secondary btn-block\" style=\"height:58px;font-size:16px;margin-top:0\" sc-camel-on-click=\"{{ goSearch }}\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21 21-4.34-4.34\"><\u002Fpath><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><\u002Fsvg>\n        Buscar por nombre, titular o N° registro\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"hr\"><\u002Fdiv>\n\n    <h6 style=\"margin:22px 0 10px\">Categorías<\u002Fh6>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"10\">\n        <button class=\"card\" style=\"align-items:flex-start;text-align:left;cursor:pointer;border:none;width:100%;padding:14px\" sc-camel-on-click=\"{{ cat.open }}\">\n          <span style=\"width:26px;height:26px;color:var(--color-accent-700)\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ cat.iconMarkup }}\"><\u002Fspan>\n          <span class=\"card-title\" style=\"font-size:14px;line-height:1.25\">{{ cat.label }}<\u002Fspan>\n          <span class=\"card-meta\">{{ cat.count }} productos<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div class=\"hr\" style=\"margin-top:28px\"><\u002Fdiv>\n    <p style=\"font-size:11px;line-height:1.6;opacity:.55;margin:16px 0 0\">\n      {{ totalCount }} productos con registro sanitario vigente · 10 categorías ISP.<br>\n      Esta app apoya la verificación en terreno — la decisión final sobre infracciones corresponde siempre al fiscalizador ANDIM.\n    <\u002Fp>\n    <p style=\"font-size:10px;opacity:.4;margin:10px 0 0\">Registros ANDIM v1.0<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSearch }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;height:100%\">\n  <div style=\"display:flex;align-items:center;gap:8px;padding:max(14px, env(safe-area-inset-top)) 10px 12px;border-bottom:2px solid var(--color-divider);flex-shrink:0\">\n    <button class=\"btn btn-icon btn-ghost\" style=\"width:44px;height:44px\" sc-camel-on-click=\"{{ goHome }}\">\n      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">Buscar<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:14px 16px 32px\">\n    <div class=\"field\" style=\"margin-bottom:10px\">\n      <input class=\"input\" style=\"min-height:48px;font-size:16px\" placeholder=\"Marca, titular o N° de registro…\" value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;white-space:nowrap\">\n      <sc-for list=\"{{ categoryChips }}\" as=\"chip\" hint-placeholder-count=\"6\">\n        <button class=\"tag\" style=\"{{ chip.chipStyle }}\" sc-camel-on-click=\"{{ chip.select }}\">{{ chip.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showEmptyPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:56px 20px;opacity:.5\">\n        <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin:0 auto 12px\"><path d=\"m21 21-4.34-4.34\"><\u002Fpath><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><\u002Fsvg>\n        <p style=\"font-size:13px;margin:0\">Escribe para buscar o elige una categoría.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showNoMatch }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:48px 20px\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin:0 auto 12px;opacity:.6\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n        <p style=\"font-weight:800;font-family:var(--font-heading);margin:0 0 6px\">No se encontró en el listado ISP<\u002Fp>\n        <p style=\"font-size:12px;opacity:.6;margin:0;max-width:34ch;margin-inline:auto\">Verifica el nombre o revisa otra categoría. Esto no confirma por sí solo la ausencia de registro — consulta con tu jefatura si tienes dudas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-size:11px;opacity:.55;margin:0 0 8px\">Mostrando {{ resultsShown }} de {{ totalResults }} resultados<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ results }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <button class=\"card\" style=\"text-align:left;border:none;cursor:pointer;width:100%\" sc-camel-on-click=\"{{ p.open }}\">\n            <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:flex-start\">\n              <span class=\"card-title\" style=\"font-size:15px\">{{ p.marca }}<\u002Fspan>\n              <span class=\"tag tag-accent\" style=\"flex-shrink:0;display:inline-flex;align-items:center;gap:4px\">\n                <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.5 8.5-.3.1-.7.1-1 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n                Vigente\n              <\u002Fspan>\n            <\u002Fdiv>\n            <span class=\"card-body\" style=\"font-size:12px\">{{ p.sub }}<\u002Fspan>\n            <div class=\"card-meta\">{{ p.catLabel }} · {{ p.titular }}<\u002Fdiv>\n            <div class=\"card-meta\" style=\"opacity:.7\">N° {{ p.registro }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;height:100%\">\n  <div style=\"display:flex;align-items:center;gap:8px;padding:max(14px, env(safe-area-inset-top)) 10px 12px;border-bottom:2px solid var(--color-divider);flex-shrink:0\">\n    <button class=\"btn btn-icon btn-ghost\" style=\"width:44px;height:44px\" sc-camel-on-click=\"{{ backFromDetail }}\">\n      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;opacity:.6\">{{ selectedCategoryLabel }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:16px 16px 40px\">\n    <h2 style=\"margin:0 0 4px;font-size:23px\">{{ selectedProduct.marca }}<\u002Fh2>\n    <p style=\"margin:0 0 12px;font-size:13px;opacity:.65\">{{ selectedProduct.sub }}<\u002Fp>\n    <span class=\"tag tag-accent\" style=\"display:inline-flex;align-items:center;gap:5px;font-size:11.5px\">\n      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.5 8.5-.3.1-.7.1-1 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n      REGISTRADO · VIGENTE ISP\n    <\u002Fspan>\n\n    <div class=\"hr\" style=\"margin:18px 0 4px\"><\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:12px;opacity:.6\">Titular del registro<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:600;text-align:right;max-width:60%\">{{ selectedProduct.titular }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:12px;opacity:.6\">Fabricante<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:600;text-align:right;max-width:60%\">{{ selectedProduct.fabricante }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:12px;opacity:.6\">País de origen<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:600;text-align:right;max-width:60%\">{{ selectedProduct.pais }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:12px;opacity:.6\">N° de registro sanitario<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:600;text-align:right;max-width:60%;font-family:ui-monospace,Menlo,monospace\">{{ selectedProduct.registro }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:12px;opacity:.6\">N° y fecha de resolución<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:600;text-align:right;max-width:60%\">{{ selectedProduct.resNum }} · {{ selectedProduct.resFecha }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasRectificacion }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-divider)\">\n        <span style=\"font-size:12px;opacity:.6\">Rectificación / modificación<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;text-align:right;max-width:60%\">{{ selectedProduct.rectificacion }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showDocsSection }}\" hint-placeholder-val=\"{{ false }}\">\n      <h6 style=\"margin:22px 0 10px\">Documentos oficiales ISP<\u002Fh6>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:6px\">\n        <sc-if value=\"{{ hasFichaRegistro }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ selectedProduct.fichaRegistroUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"justify-content:flex-start;gap:8px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><path d=\"M9 17h6\"><\u002Fpath><\u002Fsvg>\n            Ficha / resolución de registro\n          <\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasResolucionDoc }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ selectedProduct.resolucionDocUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"justify-content:flex-start;gap:8px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><path d=\"M9 17h6\"><\u002Fpath><\u002Fsvg>\n            Resolución / rectificación\n          <\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasInserto }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ selectedProduct.insertoUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"justify-content:flex-start;gap:8px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><path d=\"M9 17h6\"><\u002Fpath><\u002Fsvg>\n            Inserto autorizado\n          <\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasRotulo }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ selectedProduct.rotuloUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"justify-content:flex-start;gap:8px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><path d=\"M9 17h6\"><\u002Fpath><\u002Fsvg>\n            Rótulo autorizado\n          <\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ selectedProduct.videoUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"justify-content:flex-start;gap:8px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><path d=\"M9 17h6\"><\u002Fpath><\u002Fsvg>\n            Video instructivo\n          <\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <h6 style=\"margin:24px 0 10px\">Fotos de referencia<\u002Fh6>\n    <div style=\"display:flex;gap:10px;overflow-x:auto;padding-bottom:6px\">\n      <div style=\"flex-shrink:0;width:96px;height:96px;border-radius:var(--radius-md);background:var(--color-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\">\n        <span class=\"andim-icon\" style=\"width:34px;height:34px;color:var(--color-neutral-700)\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ selectedCategoryIconMarkup }}\"><\u002Fspan>\n        <span style=\"font-size:9px;text-align:center;padding:0 6px;opacity:.6;line-height:1.2\">Ícono de categoría<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ selectedPhotos }}\" as=\"ph\" hint-placeholder-count=\"0\">\n        <div style=\"position:relative;flex-shrink:0;width:96px;height:96px\">\n          <img src=\"{{ ph.url }}\" style=\"width:96px;height:96px;object-fit:cover;border-radius:var(--radius-md);display:block\">\n          <button class=\"btn btn-icon\" style=\"position:absolute;top:-7px;right:-7px;width:24px;height:24px;background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-sm)\" sc-camel-on-click=\"{{ ph.remove }}\">\n            <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <image-slot id=\"{{ selectedPhotoSlotId }}\" shape=\"rounded\" radius=\"0\" style=\"width:96px;height:96px;flex-shrink:0\" placeholder=\"Foto de muestra\"><\u002Fimage-slot>\n      <label style=\"flex-shrink:0;width:96px;height:96px;border:1.5px dashed var(--color-divider);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--color-accent)\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10.5px;font-weight:600\">Agregar foto<\u002Fspan>\n        <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ onAddFieldPhoto }}\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p style=\"font-size:11px;opacity:.5;margin:10px 0 0\">Las fotos que tomes en terreno quedan guardadas solo en este dispositivo. El ícono de categoría es solo referencial, no es una fotografía del producto.<\u002Fp>\n\n    <h6 style=\"margin:22px 0 10px\">Buscar imagen de referencia<\u002Fh6>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <a href=\"{{ referenceLinks.google }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"flex:1;min-width:104px\">Google Imágenes<\u002Fa>\n      <a href=\"{{ referenceLinks.bing }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"flex:1;min-width:104px\">Bing<\u002Fa>\n      <a href=\"{{ referenceLinks.mercadolibre }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"flex:1;min-width:104px\">MercadoLibre<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"font-size:11px;opacity:.5;margin:10px 0 0\">Resultados externos — son solo de referencia y no acreditan correspondencia con el registro sanitario. La verificación válida en terreno es el N° de registro impreso en el rotulado.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isScan }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;height:100%\">\n  <div style=\"display:flex;align-items:center;gap:8px;padding:max(14px, env(safe-area-inset-top)) 10px 12px;border-bottom:2px solid var(--color-divider);flex-shrink:0\">\n    <button class=\"btn btn-icon btn-ghost\" style=\"width:44px;height:44px\" sc-camel-on-click=\"{{ goHome }}\">\n      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">Escanear<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:16px 16px 32px\">\n\n    <sc-if value=\"{{ scanIsIdle }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font-size:13px;opacity:.65;margin:0 0 4px\">Encuadra solo la marca o etiqueta, bien de cerca y sin fondo alrededor (mesa, mano, otros objetos) — así el lector confunde menos texto.<\u002Fp>\n      <p style=\"font-size:11px;opacity:.5;margin:0 0 16px\">La lectura de texto necesita conexión la primera vez que se usa en este equipo, y solo funciona si la app está abierta desde su enlace web (no desde un archivo descargado).<\u002Fp>\n      <p style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.5;margin:0 0 8px\">Categoría (opcional, mejora la búsqueda)<\u002Fp>\n      <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;white-space:nowrap\">\n        <sc-for list=\"{{ scanCategoryChips }}\" as=\"chip\" hint-placeholder-count=\"6\">\n          <button class=\"tag\" style=\"{{ chip.chipStyle }}\" sc-camel-on-click=\"{{ chip.select }}\">{{ chip.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:220px;border:1.5px dashed var(--color-divider);border-radius:var(--radius-md);cursor:pointer;color:var(--color-accent)\">\n        <svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 5h-5L7.8 7.2A2 2 0 0 1 6.1 8H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-2.1a2 2 0 0 1-1.7-.8Z\"><\u002Fpath><circle cx=\"12\" cy=\"13.5\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n        <span style=\"font-weight:700;font-size:14px\">Tomar foto<\u002Fspan>\n        <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ onScanFile }}\">\n      <\u002Flabel>\n      <button class=\"btn btn-ghost\" style=\"margin-top:16px;width:100%\" sc-camel-on-click=\"{{ goSearch }}\">Buscar manualmente en vez de escanear<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ scanHasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n      <img src=\"{{ scanPhoto }}\" style=\"width:100%;height:200px;object-fit:cover;border-radius:var(--radius-md);display:block;margin-bottom:16px\">\n\n      <sc-if value=\"{{ scanIsAnalyzing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0\">\n          <div style=\"width:28px;height:28px;border-radius:50%;border:3px solid var(--color-divider);border-top-color:var(--color-accent);animation:andim-spin .8s linear infinite\"><\u002Fdiv>\n          <p style=\"font-size:13px;opacity:.6;margin:0\">{{ scanProgress }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ scanIsManual }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px;background:var(--color-surface);border-radius:var(--radius-md);margin-bottom:14px\">\n          <p style=\"font-size:12.5px;margin:0;opacity:.75\">{{ scanError }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;font-weight:700;margin:0 0 10px\">Compara visualmente o busca manualmente<\u002Fp>\n        <div style=\"display:flex;gap:10px\">\n          <button class=\"btn btn-secondary\" style=\"flex:1\" sc-camel-on-click=\"{{ retakePhoto }}\">Tomar otra foto<\u002Fbutton>\n          <button class=\"btn btn-primary\" style=\"flex:1\" sc-camel-on-click=\"{{ goSearch }}\">Buscar manualmente<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ scanIsDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-size:11px;opacity:.55;margin:0 0 14px\">Texto detectado: <strong style=\"opacity:1\">{{ scanDetectedText }}<\u002Fstrong><\u002Fp>\n\n        <sc-if value=\"{{ hasScanCandidates }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:12.5px;font-weight:700;margin:0 0 10px\">Posibles coincidencias — confirma visualmente antes de decidir<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">\n            <sc-for list=\"{{ scanCandidates }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <button class=\"card\" style=\"text-align:left;border:none;cursor:pointer;width:100%\" sc-camel-on-click=\"{{ p.open }}\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:flex-start\">\n                  <span class=\"card-title\" style=\"font-size:15px\">{{ p.marca }}<\u002Fspan>\n                  <span class=\"tag tag-accent\" style=\"flex-shrink:0\">Vigente<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"card-meta\">{{ p.catLabel }} · {{ p.titular }}<\u002Fdiv>\n                <div class=\"card-meta\" style=\"opacity:.7\">N° {{ p.registro }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ scanNoCandidates }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:20px 10px 28px\">\n            <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin:0 auto 10px;opacity:.6\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n            <p style=\"font-size:12.5px;opacity:.65;margin:0\">No se encontró coincidencia en el listado ISP para el texto detectado.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:10px\">\n          <button class=\"btn btn-secondary\" style=\"flex:1\" sc-camel-on-click=\"{{ retakePhoto }}\">Tomar otra foto<\u002Fbutton>\n          <button class=\"btn btn-primary\" style=\"flex:1\" sc-camel-on-click=\"{{ goSearch }}\">Buscar manualmente<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isImport }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;height:100%\">\n  <div style=\"display:flex;align-items:center;gap:8px;padding:max(14px, env(safe-area-inset-top)) 10px 12px;border-bottom:2px solid var(--color-divider);flex-shrink:0\">\n    <button class=\"btn btn-icon btn-ghost\" style=\"width:44px;height:44px\" sc-camel-on-click=\"{{ goHome }}\">\n      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">Actualizar datos<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:16px 16px 32px\">\n    <p style=\"font-size:13px;opacity:.65;margin:0 0 20px\">Los listados del ISP se actualizan sin previo aviso. Importa el Excel oficial más reciente de una categoría para reemplazar los datos cargados en esta app.<\u002Fp>\n\n    <div class=\"field\" style=\"margin-bottom:12px\">\n      <label>Categoría a actualizar<\u002Flabel>\n      <sc-raw-select class=\"input\" style=\"min-height:48px;font-size:15px\" value=\"{{ impSlug }}\" sc-camel-on-change=\"{{ setImportSlug }}\">\n        <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"10\">\n          <option value=\"{{ cat.slug }}\">{{ cat.label }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n\n    <label class=\"btn btn-secondary btn-block\" style=\"height:52px;font-size:14px;justify-content:center;cursor:pointer;margin-top:0\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m7 8 5-5 5 5\"><\u002Fpath><path d=\"M5 21h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2z\"><\u002Fpath><\u002Fsvg>\n      Elegir archivo Excel (.xlsx)\n      <input type=\"file\" accept=\".xlsx\" sc-camel-on-change=\"{{ onImportFile }}\">\n    <\u002Flabel>\n\n    <sc-if value=\"{{ impIsLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:14px 2px\">\n        <div style=\"width:18px;height:18px;border-radius:50%;border:2.5px solid var(--color-divider);border-top-color:var(--color-accent);animation:andim-spin .8s linear infinite\"><\u002Fdiv>\n        <span style=\"font-size:12.5px;opacity:.65\">Leyendo archivo…<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ impIsDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-size:12.5px;padding:12px 2px;margin:0\">{{ impMessage }}<\u002Fp>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ impIsError }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-size:12.5px;padding:12px 2px;margin:0;color:var(--color-accent-700)\">{{ impMessage }}<\u002Fp>\n    <\u002Fsc-if>\n\n    <div class=\"hr\" style=\"margin:22px 0 14px\"><\u002Fdiv>\n    <h6 style=\"margin:0 0 10px\">Estado de los listados<\u002Fh6>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ overridesList }}\" as=\"cat\" hint-placeholder-count=\"10\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-divider)\">\n          <div>\n            <div style=\"font-size:13px;font-weight:600\">{{ cat.label }}<\u002Fdiv>\n            <div style=\"font-size:11px;opacity:.55\">{{ cat.statusLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ cat.overridden }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-ghost\" style=\"font-size:11.5px\" sc-camel-on-click=\"{{ cat.restore }}\">Restaurar original<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;autoTextScanEnabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Escaneo&quot;},\n  &quot;maxResultsShown&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 80, &quot;min&quot;: 20, &quot;max&quot;: 200, &quot;step&quot;: 10, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Búsqueda&quot;},\n  &quot;showOfficialLinks&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Ficha de producto&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'home', loaded: false,\n    products: [], categories: [],\n    query: '', categoryFilter: 'all',\n    selectedId: null, fromView: 'home',\n    fieldPhotos: {}, overrides: {},\n    scan: { status: 'idle', photo: null, detectedText: '', candidates: [], error: '', progress: '', categoryHint: 'all' },\n    imp: { slug: 'agujas_hipodermicas', status: 'idle', message: '' },\n  };\n\n  componentDidMount() {\n    // window.ANDIM_DATA is set by a helmet-loaded script that may execute asynchronously\n    // in the bundled standalone export, so poll briefly instead of assuming it is ready.\n    this.waitForData(0);\n    let photos = {};\n    try { photos = JSON.parse(localStorage.getItem('andim_field_photos') || '{}'); } catch (e) {}\n    this.setState({ fieldPhotos: photos });\n  }\n\n  waitForData(attempt) {\n    const mod = window.ANDIM_DATA;\n    if (mod && mod.PRODUCTS && mod.CATEGORIES) {\n      this._builtinProducts = mod.PRODUCTS;\n      this._builtinCategories = mod.CATEGORIES;\n      this.loadOverridesAndBuild();\n      return;\n    }\n    if (attempt > 100) {\n      console.error('No se pudo cargar los datos (data/registro-dm.js no respondió a tiempo)');\n      this.setState({ loaded: true });\n      return;\n    }\n    setTimeout(() => this.waitForData(attempt + 1), 50);\n  }\n  loadOverridesAndBuild() {\n    let overrides = {};\n    try { overrides = JSON.parse(localStorage.getItem('andim_overrides') || '{}'); } catch (e) {}\n    const products = [];\n    for (const c of this._builtinCategories) {\n      const ov = overrides[c.slug];\n      if (ov && ov.products) products.push(...ov.products);\n      else products.push(...this._builtinProducts.filter((p) => p.cat === c.slug));\n    }\n    this.setState({ products, categories: this._builtinCategories, overrides, loaded: true });\n  }\n\n  normalize(s) {\n    return (s || '').toString().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\\s+/g, ' ').trim();\n  }\n  categoryLabel(slug) {\n    const c = (this.state.categories || []).find((c) => c.slug === slug);\n    return c ? c.label : slug;\n  }\n  categoryIcon(slug) {\n    const c = (this.state.categories || []).find((c) => c.slug === slug);\n    return c ? c.iconSvg : null;\n  }\n  iconHtml(svg) { return { __html: svg || '' }; }\n  decorate(p) {\n    return { ...p, catLabel: this.categoryLabel(p.cat), catIcon: this.categoryIcon(p.cat), sub: p.descripcion || '', open: () => this.openProduct(p.id) };\n  }\n  searchLinks(marca, catLabel) {\n    const q = [marca, catLabel].filter(Boolean).join(' ');\n    const eq = encodeURIComponent(q);\n    return {\n      query: q,\n      google: 'https://www.google.com/search?tbm=isch&q=' + eq,\n      bing: 'https://www.bing.com/images/search?q=' + eq,\n      mercadolibre: 'https://listado.mercadolibre.cl/' + eq.replace(/%20/g, '+'),\n    };\n  }\n  searchProducts(query, categorySlug) {\n    const nq = this.normalize(query);\n    const list = (this.state.products || []).filter((p) => {\n      if (categorySlug && categorySlug !== 'all' && p.cat !== categorySlug) return false;\n      if (!nq) return true;\n      const hay = this.normalize([p.marca, p.titular, p.registro, p.descripcion, p.fabricante].join(' '));\n      return hay.includes(nq);\n    });\n    return list.map((p) => this.decorate(p));\n  }\n  levenshtein(a, b) {\n    const m = a.length, n = b.length;\n    if (!m) return n; if (!n) return m;\n    let prev = new Array(n + 1); for (let j = 0; j <= n; j++) prev[j] = j;\n    for (let i = 1; i <= m; i++) {\n      const cur = [i];\n      for (let j = 1; j <= n; j++) {\n        cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);\n      }\n      prev = cur;\n    }\n    return prev[n];\n  }\n  // OCR misreads a character now and then (e.g. \"Mvlan\" for \"Mylan\") — an exact substring match\n  // would
